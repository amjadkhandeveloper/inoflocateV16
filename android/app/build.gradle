plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '3'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

android {
    namespace "com.infotrack.infolocatev16"
    compileSdk = 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.infotrack.infolocatev16"
        minSdkVersion 24
        // Play Console requires a recent target; pin 36 explicitly for this upload.
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        println "minSdkVersion: $minSdkVersion"
        println "targetSdkVersion: $targetSdkVersion"
        println "versionCode: $versionCode and $versionName"
    }

    signingConfigs {
        release {
            def releaseKeystore = file('D:\\Amjad Work\\Keystores\\my-release-key.keystore')
            if (!releaseKeystore.exists()) {
                throw new GradleException(
                    "Release keystore not found at ${releaseKeystore}. " +
                    "Play Store builds must use the upload/release keystore."
                )
            }
            keyAlias 'alias_name'
            keyPassword 'sujithu@123#'
            storeFile releaseKeystore
            storePassword 'sujithu@123#'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.3.10"
    implementation "androidx.activity:activity-ktx:1.9.3"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
